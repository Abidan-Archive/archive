name: Deploy Application

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abidan-production
  cancel-in-progress: false

env:
  APP_ENV: deployment
  APP_DEBUG: 'false'
  CACHE_STORE: array
  DB_CONNECTION: sqlite
  DB_DATABASE: ':memory:'

jobs:
  build:
    name: Test and build release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.3'
          extensions: ctype, curl, dom, fileinfo, mbstring, openssl, pdo, pdo_sqlite, session, tokenizer, xml
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/phpunit
      - run: composer audit --locked
      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress
      - name: Generate frontend routes
        env:
          APP_URL: https://${{ vars.DOMAIN }}
        run: php artisan ziggy:generate
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: node tests/ssr-smoke.mjs
      - name: Package release
        run: |
          tar -czf "$RUNNER_TEMP/$GITHUB_SHA.tar.gz" \
            --exclude='bootstrap/cache/*.php' \
            app artisan bootstrap config database lang public resources routes vendor \
            composer.json composer.lock package.json pnpm-lock.yaml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-build
          path: ${{ runner.temp }}/${{ github.sha }}.tar.gz
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy as restricted account
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prod'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: app-build
          path: ${{ runner.temp }}/artifact
      - name: Upload and activate
        env:
          HOST_IP: ${{ vars.HOST_IP }}
          HOST_USER: ${{ secrets.HOST_USER }}
          HOST_KEY: ${{ secrets.HOST_KEY }}
          HOST_KNOWN_HOSTS: ${{ secrets.HOST_KNOWN_HOSTS }}
          DATA_DIR: ${{ vars.DATA_DIR }}
          APP: ${{ vars.PHPFPM_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$HOST_IP" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$HOST_USER" == abidan-deploy ]]
          [[ "$APP" == abidan ]]
          [[ "$DATA_DIR" =~ ^/srv/http/[a-zA-Z0-9.-]+$ ]]
          test -n "$HOST_KEY"
          test -n "$HOST_KNOWN_HOSTS"
          ssh_dir="$RUNNER_TEMP/abidan-ssh"
          install -d -m 0700 "$ssh_dir"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$HOST_KEY" > "$ssh_dir/key"
          printf '%s\n' "$HOST_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          options=(-F /dev/null -i "$ssh_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts")
          scp "${options[@]}" "$RUNNER_TEMP/artifact/$GITHUB_SHA.tar.gz" \
            "$HOST_USER@$HOST_IP:$DATA_DIR/artifacts/$GITHUB_SHA.tar.gz"
          ssh "${options[@]}" "$HOST_USER@$HOST_IP" \
            bash -s -- "$DATA_DIR" "$GITHUB_SHA" "$APP" < bin/deploy-release
